<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="fav-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#09357a" flood-opacity="0.25" />
    </filter>

    <linearGradient id="fav-cap-top" x1="256" y1="100" x2="256" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b8aff" />
      <stop offset="50%" stop-color="#166fe8" />
      <stop offset="100%" stop-color="#0b52cc" />
    </linearGradient>

    <linearGradient id="fav-cap-depth" x1="256" y1="170" x2="256" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e4fb8" />
      <stop offset="100%" stop-color="#062e75" />
    </linearGradient>

    <linearGradient id="fav-book-body" x1="256" y1="200" x2="256" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d75f2" />
      <stop offset="60%" stop-color="#0b5cd9" />
      <stop offset="100%" stop-color="#0742a3" />
    </linearGradient>

    <linearGradient id="fav-page-l" x1="250" y1="250" x2="190" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="fav-page-r" x1="262" y1="250" x2="322" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="fav-tassel" x1="145" y1="180" x2="155" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b8aff" />
      <stop offset="100%" stop-color="#06398f" />
    </linearGradient>
  </defs>

  <g filter="url(#fav-shadow)">
    <!-- Book Outer Base -->
    <path d="M 172 205 L 172 312 C 172 320, 180 326, 190 328 C 216 333, 238 344, 256 345 C 274 344, 296 333, 322 328 C 332 326, 340 320, 340 312 L 340 205 Z" fill="#06347d" />
    <path d="M 172 205 L 172 304 C 172 312, 178 318, 186 320 C 214 326, 238 338, 256 339 C 274 338, 298 326, 326 320 C 334 318, 340 312, 340 304 L 340 205 Z" fill="url(#fav-book-body)" />

    <!-- Cap Thickness & Top -->
    <path d="M 136 178 L 256 226 L 376 178 L 376 190 C 376 193, 373 196, 368 198 L 258 242 C 256 243, 254 243, 252 242 L 142 198 C 138 196, 136 193, 136 190 Z" fill="url(#fav-cap-depth)" />
    <path d="M 256 112 C 258 112, 260 113, 262 114 L 374 168 C 379 171, 379 176, 374 179 L 260 224 C 258 225, 254 225, 252 224 L 138 179 C 133 176, 133 171, 138 168 L 250 114 C 252 113, 254 112, 256 112 Z" fill="url(#fav-cap-top)" />

    <!-- Book Pages -->
    <path d="M 252 204 C 240 203, 206 196, 192 201 C 190 202, 188 204, 188 207 L 188 297 C 188 299, 190 301, 192 301 C 208 298, 238 306, 252 316 Z" fill="url(#fav-page-l)" />
    <path d="M 260 204 C 272 203, 306 196, 320 201 C 322 202, 324 204, 324 207 L 324 297 C 324 299, 322 301, 320 301 C 304 298, 274 306, 260 316 Z" fill="url(#fav-page-r)" />
    <path d="M 256 202 L 256 322" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Tassel -->
    <ellipse cx="256" cy="168" rx="6" ry="3.5" fill="#166fe8" />
    <path d="M 256 168 C 200 172, 160 178, 151 184 L 151 216" stroke="#0b52cc" stroke-width="3" fill="none" />
    <ellipse cx="151" cy="217" rx="5" ry="4" fill="#2575fc" />
    <path d="M 148 220 L 142 248 C 142 253, 146 256, 151 256 C 156 256, 160 253, 160 248 L 154 220 Z" fill="url(#fav-tassel)" />
  </g>
</svg>
